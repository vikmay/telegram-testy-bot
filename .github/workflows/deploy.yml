name: Deploy Telegram Testy Bot

on:
    push:
        branches:
            - main
            - develop

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Deploy to VM via SSH
              uses: appleboy/ssh-action@v1.0.0
              with:
                  host: ${{ secrets.VM_HOST }}
                  username: ${{ secrets.VM_USER }}
                  key: ${{ secrets.VM_SSH_KEY }}

                  script: |
                      set -euo pipefail

                      # ------------------------------------------------------------------
                      # BOT ROUTING (DONE ON GITHUB SIDE)
                      # ------------------------------------------------------------------
                      REPO_DIR="${{ github.ref_name == 'main' && '/home/ubuntu/telegram-testy-bot' || '/home/ubuntu/telegram-testy-bot_2' }}"
                      SERVICE_NAME="${{ github.ref_name == 'main' && 'telegram-testy-bot' || 'telegram-testy-bot_2' }}"

                      echo "Deploying branch: ${{ github.ref_name }} → $SERVICE_NAME"

                      # ------------------------------------------------------------------
                      # SSH KEY FOR GIT
                      # ------------------------------------------------------------------
                      mkdir -p "$HOME/.ssh"
                      DEPLOY_KEY_PATH="$HOME/.ssh/deploy_key"

                      echo "${{ secrets.DEPLOY_KEY }}" > "$DEPLOY_KEY_PATH"
                      chmod 600 "$DEPLOY_KEY_PATH"

                      ssh-keyscan -H github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
                      export GIT_SSH_COMMAND="ssh -i $DEPLOY_KEY_PATH -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

                      # ------------------------------------------------------------------
                      # STOP SERVICE (PREVENT DUPLICATES / TELEGRAM CONFLICT)
                      # ------------------------------------------------------------------
                      sudo systemctl stop "$SERVICE_NAME" || true

                      # ------------------------------------------------------------------
                      # SAFE REPO SYNC
                      # ------------------------------------------------------------------
                      if [ -d "$REPO_DIR/.git" ]; then
                        cd "$REPO_DIR"

                        git fetch origin "${{ github.ref_name }}"
                        git reset --hard "origin/${{ github.ref_name }}"

                        git clean -fd \
                          -e token.txt \
                          -e venv \
                          -e "*.db" \
                          -e "data"
                      else
                        rm -rf "$REPO_DIR"
                        git clone \
                          --depth 1 \
                          --branch "${{ github.ref_name }}" \
                          "${{ secrets.REPO_SSH_URL }}" \
                          "$REPO_DIR"
                      fi

                      cd "$REPO_DIR"

                      # ------------------------------------------------------------------
                      # PRESERVE DATA
                      # ------------------------------------------------------------------
                      QUESTIONS_BAK="$(mktemp)"
                      TOPICS_BAK="$(mktemp)"

                      [ -f data/questions.json ] && cp data/questions.json "$QUESTIONS_BAK" || true
                      [ -f data/topics.json ] && cp data/topics.json "$TOPICS_BAK" || true

                      mkdir -p data

                      [ -s "$QUESTIONS_BAK" ] && cp "$QUESTIONS_BAK" data/questions.json || true
                      [ -s "$TOPICS_BAK" ] && cp "$TOPICS_BAK" data/topics.json || true

                      rm -f "$QUESTIONS_BAK" "$TOPICS_BAK"

                      # ------------------------------------------------------------------
                      # VENV (SAFE)
                      # ------------------------------------------------------------------
                      if [ ! -d "venv" ] || [ ! -x "venv/bin/python" ]; then
                        echo "Recreating venv..."
                        rm -rf venv
                        python3 -m venv venv
                      fi

                      venv/bin/pip install --upgrade pip || true

                      if [ -f requirements.txt ]; then
                        venv/bin/pip install -r requirements.txt
                      fi

                      # ------------------------------------------------------------------
                      # START SERVICE
                      # ------------------------------------------------------------------
                      echo "Starting service: $SERVICE_NAME"
                      sudo systemctl restart "$SERVICE_NAME"

                      echo "Deploy complete"
