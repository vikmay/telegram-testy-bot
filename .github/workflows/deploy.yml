name: Deploy Telegram Bots

on:
    push:
        branches:
            - main
            - develop

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Deploy to VM
              uses: appleboy/ssh-action@v1.0.3

              with:
                  host: ${{ secrets.VM_HOST }}
                  username: ${{ secrets.VM_USER }}
                  key: ${{ secrets.VM_SSH_KEY }}

                  script: |
                      set -euo pipefail

                      # ------------------------------------------------------------
                      # ROUTING
                      # ------------------------------------------------------------
                      if [ "${{ github.ref_name }}" = "main" ]; then
                        REPO_DIR="/home/ubuntu/telegram-testy-bot"
                        SERVICE_NAME="telegram-testy-bot"
                      else
                        REPO_DIR="/home/ubuntu/telegram-testy-bot_2"
                        SERVICE_NAME="telegram-testy-bot_2"
                      fi

                      echo "Deploying branch: ${{ github.ref_name }}"
                      echo "Repo dir: $REPO_DIR"
                      echo "Service: $SERVICE_NAME"

                      # ------------------------------------------------------------
                      # ENSURE REPO EXISTS
                      # ------------------------------------------------------------
                      if [ ! -d "$REPO_DIR/.git" ]; then
                        echo "Repository not found"
                        exit 1
                      fi

                      cd "$REPO_DIR"

                      # ------------------------------------------------------------
                      # STOP SERVICE
                      # ------------------------------------------------------------
                      sudo systemctl stop "$SERVICE_NAME" || true

                      # ------------------------------------------------------------
                      # UPDATE REPOSITORY
                      # ------------------------------------------------------------
                      git fetch origin

                      git reset --hard "origin/${{ github.ref_name }}"

                      git clean -fd

                      # ------------------------------------------------------------
                      # VENV
                      # ------------------------------------------------------------
                      if [ ! -d "venv" ] || [ ! -x "venv/bin/python" ]; then
                        echo "Creating venv..."
                        rm -rf venv
                        python3 -m venv venv
                      fi

                      # ------------------------------------------------------------
                      # INSTALL REQUIREMENTS
                      # ------------------------------------------------------------
                      venv/bin/pip install --upgrade pip

                      if [ -f requirements.txt ]; then
                        venv/bin/pip install -r requirements.txt
                      fi

                      # ------------------------------------------------------------
                      # START SERVICE
                      # ------------------------------------------------------------
                      sudo systemctl restart "$SERVICE_NAME"

                      # ------------------------------------------------------------
                      # HEALTHCHECK
                      # ------------------------------------------------------------
                      sleep 5

                      if ! systemctl is-active --quiet "$SERVICE_NAME"; then
                        echo "Service failed to start"

                        echo "===== STATUS ====="
                        sudo systemctl status "$SERVICE_NAME" --no-pager || true

                        echo "===== LOGS ====="
                        journalctl -u "$SERVICE_NAME" -n 50 --no-pager || true

                        exit 1
                      fi

                      echo "Deploy complete ✔"
